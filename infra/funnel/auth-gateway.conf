# 인터넷에 공개하는 Keycloak 경로를 회원 로그인에 필요한 것만으로 줄인다 (Funnel 8443 → 127.0.0.1:8088 → 여기)
server {
    listen 8088;
    server_name _;
    server_tokens off;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Funnel(Tailscale)이 붙인 접속 주소만 믿는다 (이 포트는 127.0.0.1 에만 열려 있음)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location ^~ /realms/matchmaking/account { return 404; }      # 계정 콘솔 비공개 (비밀번호 변경은 앱의 '내 계정'에서)
    location ^~ /realms/matchmaking/ {
        proxy_pass https://keycloak:8443;
        proxy_ssl_verify off;                       # 내부망 구간 (Keycloak 자체 서명 인증서)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /resources/ {
        proxy_pass https://keycloak:8443;
        proxy_ssl_verify off;                       # 내부망 구간 (Keycloak 자체 서명 인증서)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }                                    # /admin, /realms/master 등은 인터넷에서 보이지 않음
}
